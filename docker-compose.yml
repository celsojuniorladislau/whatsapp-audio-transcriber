services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      EVOLUTION_BASE_URL: http://evolution-go:4000
      DATABASE_PATH: /data/messages.sqlite3
      HF_HOME: /models/hf
    volumes:
      - app_data:/data
      - whisper_models:/models
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      evolution-go:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  evolution-go:
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-go:latest}
    restart: unless-stopped
    environment:
      SERVER_PORT: 4000
      SERVER_URL: http://localhost:4000
      CLIENT_NAME: "evolution"
      GLOBAL_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      POSTGRES_AUTH_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      POSTGRES_USERS_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      WADEBUG: "INFO"
      LOGTYPE: "console"
      CONNECT_ON_STARTUP: "false"
      WEBHOOK_FILES: "true"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - evolution_instances:/app/dbdata
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_data:
  evolution_instances:
  postgres_data:
  whisper_models:
